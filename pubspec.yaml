name: parkourspotkorea
description: "Parkour Spot Finder Korea"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.12.3
  geojson: ^1.0.0
  geolocator: ^14.0.2
  turf: ^0.0.10 #point-in-polygon 계산용
  location: ^8.0.1
  shared_preferences: ^2.5.3 #로컬 저장용
  image_picker: ^1.1.2
  material_symbols_icons: ^4.2815.1
  go_router: ^16.0.0
  http: ^1.4.0
  sqflite: ^2.4.2
  path: ^1.9.1
  permission_handler: 12.0.1
  geocoding: ^4.0.0
  video_player: ^2.10.0
  lottie: ^3.3.2
  custom_info_window: ^1.0.1
  intl: ^0.20.2

  fluttertoast: ^8.2.12

  cupertino_icons: ^1.0.8

  #구글
  google_sign_in: ^7.1.1

  #firebase 패키지
  firebase_core: ^3.15.1
  firebase_storage: ^12.4.9
  firebase_remote_config: ^5.4.7
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12

  # 네트워크 & 캐싱
  dio: ^5.8.0+1  # HTTP 클라이언트
  path_provider: ^2.1.5  # 캐시 저장용
  connectivity_plus: ^6.1.4 # 네트워크 상태 체크
  provider: ^6.1.5

  #DB
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.38
  drift_flutter: ^0.2.5



dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.28.0
  #icon 적용
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  build_runner: ^2.6.0
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

flutter_launcher_icons:
    ios: true
    android: "launcher_icon"
    remove_alpha_ios: true
    image_path_ios: "assets/icons/parkourSpot-iOS.png"
    image_path_android: "assets/icons/parkourSpot-android.png"


flutter_native_splash:
  color: "#07071A"
  image: "assets/icons/parkourSpot-android2.png"
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#07071A"
    image: "assets/icons/parkourSpot-android2.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/appleIcon_loginPage.svg
    - assets/icons/
    - assets/icons/material-symbols_globe-asia-sharp.svg
    - assets/icons/person.svg
    - assets/icons/star.svg
    - assets/logo/
    - assets/logo/background-logo.svg
    - assets/images/
    - assets/spot/
    - assets/jsons/
    - assets/QRcode/
    - assets/GeoJSON/
    - assets/fonts/Pretendard/
    - assets/map_style/map_style.json
    - assets/map_style/map_darkstyle.json
    - assets/videos/testvideo.mp4


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    #보여질 폰트 이름
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/Pretendard-Regular.ttf
          weight: 100
        - asset: assets/fonts/Pretendard/Pretendard-Black.ttf
          weight: 200
        - asset: assets/fonts/Pretendard/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard/Pretendard-Medium.ttf
          weight: 400
        - asset: assets/fonts/Pretendard/Pretendard-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/Pretendard/Pretendard-ExtraBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard/Pretendard-Bold.ttf
          weight: 700

    - family: Giants
      fonts:
        - asset: assets/fonts/Giants/Giants-Bold.ttf
          weight: 700
        - asset: assets/fonts/Giants/Giants-Inline.ttf
          weight: 400
        - asset: assets/fonts/Giants/Giants-Regular.ttf
          weight: 100


  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #

